#      - ./postgresql/fixtures:/docker-entrypoint-initdb.d:ro,delegated
#    networks:
#      - internal

  web:
    image: php:8.3-apache
    container_name: web
    hostname: web
    restart: unless-stopped
    environment:
      PHP_SESSION_SAVE_PATH: "${PHP_SESSION_HOST:-memcached:11211}"
      PHP_SESSION_NAME: "${PHP_SESSION_NAME:-BASICSESSID}"
      BASIC_APP_ENV: "${BASIC_APP_ENV:-prod}"
    ports:
      - "8090:80"
    volumes:
      - ./config/apache2/sites-enabled:/etc/apache2/sites-enabled/
      - ./web:/var/www/html/
      - ./log:/var/log/apache2/
      - ./config/php/php.ini:/usr/local/etc/php/php.ini
    depends_on:
      - memcached
      - redis
      - mariadb
      #- postgres
    networks:
      - internal
      - external

networks:
  internal:
  external:
    driver: bridge
