services:
  memcached:
    image: memcached
    container_name: memcached
    hostname: memcached
    environment:
      - MEMCACHED_MEMORY_LIMIT=128
    networks:
      - internal

  redis:
    image: redis:alpine
    container_name: redis
    hostname: redis
    restart: unless-stopped
    volumes:
      - ./redis/data:/data
    networks:
      - internal

  mariadb:
    image: mariadb:latest
    container_name: mariadb
    hostname: mariadb
    restart: unless-stopped
    command: [
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_unicode_ci',
      '--transaction-isolation=READ-COMMITTED',
      '--log-bin=binlog',
      '--binlog-format=ROW',
    ]
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-nopassword}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-basic}"
      MYSQL_USER: "${MYSQL_USER:-basic}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-nopassword}"
    volumes:
      - ./mariadb/data:/var/lib/mysql
      - ./log:/var/log/mysql
      - ./mariadb/fixtures:/docker-entrypoint-initdb.d:ro,delegated
    networks:
      - internal

  mariadb-backup:
    image: dsteinkopf/backup-all-mysql:latest
    container_name: mariadb-backup
    hostname: mariadb-backup
    restart: unless-stopped
    environment:
      BACKUP_INTERVAL: 86400
      BACKUP_FIRSTDELAY: 4000
      MYSQL_CONNECTION_PARAMS: "--user=${MYSQL_PASSWORD:-nopassword} --host=mariadb --password=${MYSQL_PASSWORD:-nopassword}"
    depends_on:
      - mariadb
    volumes:
      - ./mariadb/backup:/var/dbdumps
    networks:
      - internal

